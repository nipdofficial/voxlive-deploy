services:
  api:
    build:
      context: ./backend
    container_name: voxlive-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Production must point this at the attached persistent EBS volume.
      # Do not replace this with a Docker-managed named volume during a host
      # update, or the next host may start with an empty data directory.
      - ${VOXLIVE_DATA_DIR:?Set VOXLIVE_DATA_DIR to the persistent EBS data directory}:/app/data
